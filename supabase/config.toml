# Declares deploy-time settings for this project's edge functions so they
# aren't lost the next time a function is redeployed.
#
# launch-demo must be callable by a brand-new, not-yet-authenticated visitor
# (it creates their session), so it can't require a JWT up front like every
# other function here does by default.
[functions.launch-demo]
verify_jwt = false

# Called only by the pg_cron job scheduled in the migrations (never by a
# browser), authenticated with its own CRON_TRIGGER_SECRET instead of a
# Supabase user JWT — see the function's own doc comment.
[functions.delete-expired-demo-accounts]
verify_jwt = false
